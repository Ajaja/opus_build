name: Build Opus Tools (Windows x64 / MSYS2 CLANG64, fully static)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Set up MSYS2 (CLANG64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            base-devel
            autoconf
            automake
            libtool
            m4
            git
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf

      # Everything gets installed into the CLANG64 prefix so pkg-config finds
      # each library automatically as later steps build against it.
      # LDFLAGS=-static + PKG_CONFIG="pkg-config --static" force fully static
      # linking end-to-end, including transitive deps pulled in via
      # Libs.private in each .pc file (e.g. opusfile -> opus, ogg).
      - name: Sanity-check toolchain
        run: |
          set -e
          for tool in autoreconf automake libtool pkg-config cmake ninja; do
            command -v "$tool" >/dev/null || { echo "ERROR: $tool not found on PATH"; exit 1; }
          done
          echo "All required build tools found."

      - name: Set environment
        run: |
          echo "PREFIX=/clang64" >> "$GITHUB_ENV"
          echo "MAKEFLAGS=-j$(nproc)" >> "$GITHUB_ENV"
          echo "LDFLAGS=-static" >> "$GITHUB_ENV"
          echo "PKG_CONFIG=pkg-config --static" >> "$GITHUB_ENV"

      - name: Clone sources
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/src"
          cd "$GITHUB_WORKSPACE/src"
          git clone --depth 1 https://gitlab.xiph.org/xiph/ogg.git
          git clone --depth 1 https://gitlab.xiph.org/xiph/opus.git
          git clone --depth 1 https://gitlab.xiph.org/xiph/opusfile.git
          git clone --depth 1 https://gitlab.xiph.org/xiph/libopusenc.git
          git clone --depth 1 https://gitlab.xiph.org/xiph/opus-tools.git
          # FLAC input support for opusenc; official repo lives on GitHub.
          git clone --depth 1 https://github.com/xiph/flac.git

      - name: Build libogg (static)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/src/ogg"
          ./autogen.sh
          ./configure --prefix="$PREFIX" --enable-static --disable-shared
          make
          make install

      # Tries autotools first, falls back to CMake for checkouts that have
      # moved to a CMake-only build.
      - name: Build libopus (static)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/src/opus"
          if [ -f autogen.sh ]; then
            ./autogen.sh
            ./configure --prefix="$PREFIX" --enable-static --disable-shared
            make
            make install
          else
            cmake -B build -G Ninja \
              -DCMAKE_INSTALL_PREFIX="$PREFIX" \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF
            cmake --build build
            cmake --install build
          fi

      - name: Build FLAC (static)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/src/flac"
          cmake -B build -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_CXXLIBS=OFF \
            -DBUILD_PROGRAMS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_DOCS=OFF \
            -DINSTALL_MANPAGES=OFF \
            -DWITH_OGG=ON
          cmake --build build
          cmake --install build

      - name: Build opusfile (static)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/src/opusfile"
          ./autogen.sh
          # HTTP streaming needs OpenSSL/LibreSSL; not needed for local file
          # decoding via opusdec/opusinfo, so it's disabled.
          ./configure --prefix="$PREFIX" --disable-http --enable-static --disable-shared
          make
          make install

      - name: Build libopusenc (static)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/src/libopusenc"
          ./autogen.sh
          ./configure --prefix="$PREFIX" --enable-static --disable-shared
          make
          make install

      - name: Build opus-tools (static executables)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/src/opus-tools"
          ./autogen.sh
          ./configure --prefix="$PREFIX"
          make
          make install

      - name: Collect executables and verify they are static
        run: |
          set -e
          OUT="$GITHUB_WORKSPACE/artifact"
          mkdir -p "$OUT"

          for exe in opusenc opusdec opusinfo; do
            found=$(find "$GITHUB_WORKSPACE/src/opus-tools" -name "${exe}.exe" | head -n1)
            if [ -z "$found" ]; then
              echo "ERROR: ${exe}.exe was not produced by the build"
              exit 1
            fi
            cp "$found" "$OUT/"
          done

          cd "$OUT"
          echo "== ldd output =="
          ldd *.exe || true

          # Fail the build if anything still pulls in a DLL from the MSYS2/
          # toolchain tree -- that would mean static linking didn't fully
          # take effect somewhere.
          if ldd *.exe 2>/dev/null | grep -iE '/(clang64|mingw64|usr)/'; then
            echo "ERROR: one or more executables still depend on non-system DLLs"
            exit 1
          fi

          echo "All executables are fully static."
          ls -la "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opus-tools-windows-x64-clang64-static
          path: artifact/*
          if-no-files-found: error
